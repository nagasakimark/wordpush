<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Push! ことばブロック</title>
<style>
:root { --bi-brown: none; --ink: #4a2a10; --cream: #fff4d6; --cream2: #ffe9b0; --wood: #a8642a; --woodD: #6b3a12; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #7fd2ff; }
body {
  font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
  color: var(--ink); user-select: none; -webkit-user-select: none;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hidden { display: none !important; }
button { font: inherit; cursor: pointer; border: 0; padding: 0; background: none; color: inherit; }
.stroke { text-shadow: -2px -2px 0 var(--woodD), 2px -2px 0 var(--woodD), -2px 2px 0 var(--woodD), 2px 2px 0 var(--woodD), 0 3px 0 var(--woodD); }

/* sprite buttons */
.sbtn {
  --c1: #ffe066; --c2: #ff9a14; --bd: #9a4a00;
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 46px; padding: 0 20px; border: 4px solid var(--bd); border-radius: 999px; white-space: nowrap;
  background: linear-gradient(var(--c1), var(--c2)) !important; color: #fff; font-weight: 900; font-size: 16px; letter-spacing: .5px;
  box-shadow: 0 5px 0 var(--bd), 0 9px 8px rgba(0,0,0,.28), inset 0 -4px 0 rgba(0,0,0,.14);
  text-shadow: -1.5px -1.5px 0 var(--bd), 1.5px -1.5px 0 var(--bd), -1.5px 1.5px 0 var(--bd), 1.5px 1.5px 0 var(--bd), 0 2px 0 var(--bd);
  transition: transform .08s, filter .08s; margin-bottom: 5px;
}
.sbtn::before { content: ""; position: absolute; left: 9%; right: 9%; top: 2px; height: 44%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,.12)); pointer-events: none; }
.sbtn > * { position: relative; }
.sbtn img.ic { height: 20px; margin: 0 -1px 0 0; filter: drop-shadow(0 2px 0 var(--bd)); }
.sbtn.blue { --c1: #7fdcff; --c2: #1b8ff0; --bd: #0b4a96; }
.sbtn.green { --c1: #a6f56e; --c2: #25b516; --bd: #17680d; }
.sbtn.red { --c1: #ff9a8a; --c2: #ec2a34; --bd: #8e0f1c; }
.sbtn.steel { --c1: #e2a8ff; --c2: #8b3fe6; --bd: #4a1a96; }
.sbtn:hover { filter: brightness(1.1) saturate(1.1); transform: translateY(-2px); }
.sbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bd), 0 3px 4px rgba(0,0,0,.28), inset 0 -4px 0 rgba(0,0,0,.14); }
.sbtn.sm { height: 38px; padding: 0 12px; font-size: 13px; } .sbtn.sm img.ic { height: 15px; }

/* chips (same colours as blocks) */
.chip { display: inline-block; min-width: 46px; text-align: center; padding: 2px 8px; border-radius: 99px; font-weight: 900; font-size: 13px; color: #fff;
  border: 2px solid #1d2a38; box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
  text-shadow: 0 1px 0 rgba(70,35,5,.8); }
.t-pro, .t-noun { background: #3d8be0; } .t-can, .t-cant, .t-is, .t-want, .t-wants { background: #e3a914; }
.t-verb { background: #e2494b; } .t-adj { background: #2fb36a; } .t-not { background: #9b4fe0; }

/* MENU */
#menu { position: absolute; inset: 0; overflow-y: auto; padding: 10px 18px 20px; text-align: center; z-index: 2; }
#logo { display: flex; justify-content: center; gap: 2px; margin-top: 0; height: 74px; align-items: flex-end; }
#logo span {
  display: inline-block; font-size: 60px; font-weight: 900; line-height: 1; color: #fff; transform-origin: 50% 100%;
  -webkit-text-stroke: 9px var(--woodD); paint-order: stroke fill; text-shadow: 0 6px 0 var(--woodD), 0 10px 6px rgba(0,0,0,.25);
  animation: jig 1.8s ease-in-out infinite;
}
#logo span.sp { width: 18px; }
@keyframes jig { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
#menu .sub { text-shadow: -2px -2px 0 #1b6fb0, 2px -2px 0 #1b6fb0, -2px 2px 0 #1b6fb0, 2px 2px 0 #1b6fb0, 0 3px 0 #1b6fb0; margin: 2px 0 6px; font-weight: 900; font-size: 18px; color: #fff; }
.legend { display: flex; gap: 8px; justify-content: center; margin: 0 auto 10px; }
.legend span { font-size: 13px; font-weight: 900; background: rgba(255,255,255,.85); padding: 3px 10px 3px 4px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--woodD); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 1280px; margin: 0 auto; padding-bottom: 14px; }
.card { position: relative; height: 112px; border: 4px solid #8a4b14; border-radius: 18px; background: linear-gradient(#fffef2, #ffeeb8); box-shadow: 0 5px 0 #8a4b14, 0 9px 8px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.9); transition: transform .08s; color: var(--ink); padding: 0; margin-bottom: 4px; }
.card:hover { transform: translateY(-4px) rotate(-1deg); } .card:active { transform: translateY(3px); } .card:active { transform: translateY(2px); }
.card .n { position: absolute; left: 4px; top: 4px; background: radial-gradient(circle at 35% 30%, #ff9a7a, #e8262b); color: #fff; border-radius: 50%; width: 28px; height: 28px; line-height: 23px; font-weight: 900; font-size: 15px; border: 3px solid #8e0f1c; text-shadow: 0 1px 0 #8e0f1c; }
.card img.h { position: absolute; right: 4px; top: 2px; height: 50px; }
.card .ti { position: absolute; left: 8px; right: 6px; top: 53px; font-weight: 900; font-size: 12px; line-height: 1.12; text-align: left; max-height: 28px; overflow: hidden; }
.card .gp { position: absolute; left: 6px; bottom: 6px; max-width: calc(100% - 38px); overflow: hidden; text-overflow: ellipsis; font-size: 10px; letter-spacing: -.2px; font-weight: 900; color: #fff; background: linear-gradient(#7fdcff,#1b8ff0); padding: 0 8px; border-radius: 99px; border: 2px solid #0b4a96; white-space: nowrap; }
.card .done { position: absolute; right: 3px; bottom: 3px; height: 24px; }
.foot { margin: 12px 0 0; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

/* GAME */
#game { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 2; }
#top { display: flex; align-items: center; gap: 10px; padding: 4px 14px 0; height: 62px; flex: none; background: linear-gradient(#ffc04a, #ff8a1f); border-bottom: 6px solid #9a4a00; box-shadow: 0 4px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.55); }
#top .title { flex: 1; min-width: 0; color: #fff; text-shadow: -2px -2px 0 #9a4a00, 2px -2px 0 #9a4a00, -2px 2px 0 #9a4a00, 2px 2px 0 #9a4a00, 0 3px 0 #9a4a00 !important; font-weight: 900; font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .title small { display: inline-block; margin-left: 10px; font-size: 12px; background: linear-gradient(#7fdcff,#1b8ff0); color: #fff; padding: 2px 12px; border-radius: 99px; border: 3px solid #0b4a96; text-shadow: none; vertical-align: middle; }
#stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 304px; gap: 6px; padding: 6px 10px 8px; }
#boardWrap { position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
#cv { display: block; touch-action: none; }
#side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; padding: 2px 4px 6px 0; }
.panel { border: 4px solid #8a4b14; border-radius: 18px; background: linear-gradient(#fffef2, #ffeeb8); padding: 7px 10px; box-shadow: 0 4px 0 #8a4b14, 0 8px 8px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.9); }
.panel h3 { margin: 0 0 5px; font-size: 13px; color: #d4531c; letter-spacing: .5px; }
#hcard { display: flex; align-items: center; gap: 8px; }
#hcard img { height: 58px; margin: -6px 0 -4px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
#hcard .t { font-weight: 800; font-size: 13px; } #hcard .t b { font-size: 16px; }
#sents { display: flex; flex-direction: column; gap: 5px; min-height: 40px; }
.sent { background: #fffdf3; border-radius: 12px; padding: 5px 7px; border: 3px solid #ecd9a8; }
.sent.ok { border-color: #34b45f; background: #effcf1; }
.sent .row { display: flex; gap: 4px; flex-wrap: wrap; }
.sent .jp { font-size: 12.5px; font-weight: 800; margin-top: 3px; }
.sent .note { font-size: 11.5px; font-weight: 800; color: #1f9d4b; } .sent:not(.ok) .note { color: #9b7a50; }
.none { font-size: 12.5px; font-weight: 800; opacity: .6; }
#msg { font-weight: 800; font-size: 13.5px; line-height: 1.4; min-height: 70px; display: flex; align-items: center; }
#msg.warn { background: linear-gradient(#ffe9e5, #ffc9c2); border-color: #b3261e; box-shadow: 0 4px 0 #b3261e, 0 8px 8px rgba(0,0,0,.2); color: #b3261e; }
#msg.hint { background: linear-gradient(#fffbd0, #ffee7a); }
.side-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-legend { display: flex; gap: 5px; flex-wrap: wrap; } .mini-legend .chip { min-width: 0; font-size: 11px; padding: 1px 7px; }
.keys { margin-top: 6px; font-size: 11.5px; font-weight: 800; opacity: .75; }
#dpad { display: none; position: absolute; right: 12px; bottom: 12px; width: 156px; height: 156px; z-index: 20; }
#dpad button { position: absolute; width: 54px; height: 54px; padding: 0 !important; border-radius: 50% !important; } #dpad button img.ic { height: 24px; margin: 0; }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(8, 1fr); } }
@media (pointer: coarse) { #dpad { display: block; } }
@media (max-width: 860px) { #stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } #side { flex-direction: row; flex-wrap: wrap; max-height: 34vh; } #side .panel { flex: 1 1 240px; } }

/* win overlay */
#win { position: absolute; inset: 0; background: rgba(60,30,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
#winbox { position: relative; border: 6px solid #8a4b14; border-radius: 28px; background: linear-gradient(#fffef2, #ffeeb8); padding: 14px 24px 18px; max-width: 470px; width: 100%; text-align: center;
  box-shadow: 0 8px 0 #8a4b14, 0 14px 16px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.9); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
#winbox h2 { margin: 0; font-size: 38px; color: #fff; -webkit-text-stroke: 7px var(--woodD); paint-order: stroke fill; text-shadow: 0 4px 0 var(--woodD); }
#winbox .hero { height: 104px; margin: -2px 0 -6px; animation: cheer .6s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
@keyframes cheer { 50% { transform: translateY(-12px) rotate(3deg); } }
#winbox .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; } #winbox .stars img { height: 46px; animation: starin .5s both; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
#winbox .stars img:nth-child(2) { animation-delay: .15s; } #winbox .stars img:nth-child(3) { animation-delay: .3s; }
@keyframes starin { from { transform: scale(0) rotate(-90deg); } }
#winbox .sent { text-align: left; margin: 5px 0; } #winbox .stat { font-weight: 900; margin: 4px 0 10px; }
#winbox .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* tutorial */
#tut { position: absolute; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(60,30,0,.35); padding: 8px; }
#tutbox { position: relative; width: min(980px, 100%); height: min(560px, 100%); border: 6px solid #8a4b14; border-radius: 28px; background: linear-gradient(#fffef2, #ffeeb8); box-shadow: 0 8px 0 #8a4b14, 0 14px 16px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.9); display: flex; flex-direction: column; padding: 8px 20px 10px; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
#tutHead { display: flex; align-items: center; justify-content: center; gap: 10px; height: 46px; flex: none; }
#tutHead h2 { margin: 0; font-size: 30px; color: #fff; -webkit-text-stroke: 7px #9a4a00; paint-order: stroke fill; text-shadow: 0 4px 0 #9a4a00; text-align: center; }
#tutBody { flex: 1; min-height: 0; display: flex; align-items: center; gap: 18px; }
#tutGuide { flex: none; width: 190px; text-align: center; } #tutGuide img { height: 170px; animation: cheer 1.1s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
#tutMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: stretch; justify-content: center; height: 100%; }
.say { background: #fff; border: 4px solid #8a4b14; border-radius: 18px; padding: 8px 14px; font-weight: 900; font-size: 21px; line-height: 1.5; position: relative; box-shadow: 0 4px 0 rgba(60,30,0,.25); }
.say::before { content: ""; position: absolute; left: -18px; top: 30px; border: 10px solid transparent; border-right: 14px solid #8a4b14; }
.say small { display: block; font-size: 15px; opacity: .85; margin-top: 2px; }
.say em { font-style: normal; color: #d4531c; } .say b.g { color: #1f9d4b; } .say b.r { color: #c4271e; }
.vis { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: rgba(255,255,255,.55); border: 3px dashed #d9b97a; border-radius: 18px; padding: 8px; }
.vis img.s { height: 84px; } .vis img.hh { height: 104px; }
.vcol { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; font-size: 15px; text-align: center; }
.vcol .lab { padding: 1px 10px; border-radius: 99px; color: #fff; border: 2px solid var(--woodD); text-shadow: 0 1px 0 rgba(70,35,5,.8); font-size: 14px; }
.vcol .big { font-size: 28px; color: #d4531c; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; line-height: 1; }
.tb { position: relative; display: inline-block; width: 78px; height: 74px; } .tb img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(60,30,0,.3)); }
.tb b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; -webkit-text-stroke: 4px #5a2f0d; paint-order: stroke fill; }
.arrow { font-size: 34px; font-weight: 900; color: #d4531c; } .ok { color: #1f9d4b; font-size: 34px; font-weight: 900; } .ng { color: #d22; font-size: 34px; font-weight: 900; }
.row { display: flex; align-items: center; gap: 6px; }
.vis .eq { font-size: 20px; font-weight: 900; }
#tutNav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px; padding-top: 4px; }
#tutDots { display: flex; gap: 6px; } #tutDots i { width: 11px; height: 11px; border-radius: 50%; background: #d9b97a; border: 2px solid var(--woodD); } #tutDots i.on { background: #ff7a3c; transform: scale(1.25); }
.sbtn.ghost { filter: grayscale(.4) drop-shadow(0 3px 0 rgba(60,30,0,.3)); opacity: .85; }
@media (max-height: 520px) { .say { font-size: 18px; } #tutGuide img { height: 130px; } #tutGuide { width: 150px; } }
.toprow { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 0 6px; } .toprow .legend { margin: 0; } .toprow .sbtn { margin-bottom: 5px; }

.t-am, .t-are, .t-have, .t-has, .t-and { background: #e3a914; }
.chap { grid-column: 1 / -1; text-align: left; color: #fff; font-weight: 900; font-size: 17px; margin: 6px 4px -2px; text-shadow: -2px -2px 0 #1b6fb0, 2px -2px 0 #1b6fb0, -2px 2px 0 #1b6fb0, 2px 2px 0 #1b6fb0, 0 3px 0 #1b6fb0; }
.card.sand { background: linear-gradient(#fff3fb, #ffd0ea); }
.bookc { font-weight: 900; color: #fff; text-shadow: 0 2px 0 #1b6fb0; }
#natPanel ul { margin: 0; padding: 0; list-style: none; font-size: 11px; font-weight: 800; line-height: 1.35; display: grid; grid-template-columns: 1fr 1fr; gap: 1px 8px; } #natPanel li::before { content: '・'; } #natPanel li.off { text-decoration: line-through; opacity: .5; }
#toast { position: absolute; left: 50%; top: 8px; transform: translate(-50%, -30px); opacity: 0; pointer-events: none; background: linear-gradient(#fff9d6, #ffe680); border: 4px solid #9a4a00; border-radius: 16px; padding: 6px 14px; font-weight: 900; font-size: 14px; text-align: center; box-shadow: 0 5px 0 #9a4a00, 0 8px 10px rgba(0,0,0,.25); z-index: 30; }
#toast b { display: block; color: #d4531c; font-size: 15px; } #toast .row { display: flex; gap: 4px; justify-content: center; margin: 3px 0; }
#toast.show { animation: toastIn 3.2s ease forwards; }
@keyframes toastIn { 0% { opacity: 0; transform: translate(-50%, -30px) scale(.8); } 8% { opacity: 1; transform: translate(-50%, 0) scale(1.06); } 12% { transform: translate(-50%, 0) scale(1); } 85% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -20px); } }
#card, #book { position: absolute; inset: 0; z-index: 65; display: flex; align-items: center; justify-content: center; background: rgba(60,30,0,.4); padding: 10px; }
#cardbox, #bookbox { border: 6px solid #8a4b14; border-radius: 28px; background: linear-gradient(#fffef2, #ffeeb8); box-shadow: 0 8px 0 #8a4b14, 0 14px 16px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.9); padding: 12px 22px 14px; text-align: center; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
#cardbox { width: min(760px, 100%); display: flex; flex-direction: column; gap: 10px; align-items: center; }
#cardbox h2, #bookbox h2 { margin: 0; font-size: 30px; color: #fff; -webkit-text-stroke: 7px #9a4a00; paint-order: stroke fill; text-shadow: 0 4px 0 #9a4a00; }
#cardbox .say { text-align: left; width: 100%; } #cardbox .say::before { display: none; }
#cardbox .vis { width: 100%; min-height: 110px; flex: none; }
#bookbox { width: min(980px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 8px; }
.bookcols { display: grid; grid-template-columns: 1.4fr 1fr; gap: 12px; min-height: 0; overflow: hidden; text-align: left; flex: 1; }
.bookcols > div { overflow-y: auto; max-height: 420px; } #bookList { display: flex; flex-direction: column; gap: 5px; } #bookEv { font-weight: 800; font-size: 14px; line-height: 1.6; }
.bookcols h3 { margin: 0 0 6px; color: #d4531c; }
#winbox .wsents { max-height: 140px; overflow-y: auto; }
#bookClose { align-self: center; }
#toast { top: auto; bottom: 22px; }
body.nojp .jpx { display: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="menu">
  <div id="logo"></div>
  <p class="sub">ことばブロックを おして、ぶんを つくろう!</p>
  <div class="toprow"><button class="sbtn blue" id="bHow" style="height:52px;font-size:18px;padding:0 14px">あそびかた を みる</button><button class="sbtn steel" id="bBook" style="height:52px;font-size:18px;padding:0 14px">ぶん ずかん</button><span class="bookc"><b id="bookCount">0</b> ぶん</span><button class="sbtn green" id="bQR" style="height:52px;font-size:18px;padding:0 14px" aria-label="スキャンして あそぼう">QRコード</button><div class="legend">
    <span><b class="chip t-noun">DOG</b> なまえ</span><span><b class="chip t-can">CAN</b> つなぐ</span>
    <span><b class="chip t-verb">SWIM</b> うごき</span><span><b class="chip t-adj">OPEN</b> ようす</span>
  </div></div>
  <div class="grid" id="levelGrid"></div>
</div>

<div id="game" class="hidden">
  <div id="top">
    <button class="sbtn steel" id="bMenu">メニュー</button>
    <div class="title stroke" id="ttl"></div>
    <button class="sbtn blue" id="bHow2">あそびかた</button><button class="sbtn" id="bHint">ヒント</button>
    <button class="sbtn green" id="bUndo">もどす</button>
    <button class="sbtn red" id="bReset">やりなおし</button>
  </div>
  <div id="stage">
    <div id="boardWrap"><canvas id="cv"></canvas><div id="toast"></div></div>
    <div id="side">
      <div class="panel"><div id="hcard"><img id="hImg" alt=""><div class="t" id="hText"></div></div></div>
      <div class="panel"><h3>いま の ぶん</h3><div id="sents"></div></div>
      <div class="panel" id="msg"></div>
      <div class="panel" id="natPanel"><h3>いつもの ルール</h3><ul id="nature"></ul></div>
      <div class="panel">
        <div class="side-btns">
          <button class="sbtn sm" id="bWait">まつ</button><button class="sbtn sm blue" id="bJp">にほんご</button><button class="sbtn sm green" id="bSnd">おと OFF</button>
        </div>
        <div class="keys">うごく: ↑↓←→　まつ: スペース　もどす: Z　やりなおし: R</div>
      </div>
    </div>
  </div>
  <div id="dpad"><button style="left:52px;top:0" data-d="U" id="dU"></button><button style="left:0;top:52px" data-d="L" id="dL"></button>
    <button style="left:104px;top:52px" data-d="R" id="dR"></button><button style="left:52px;top:104px" data-d="D" id="dD"></button></div>
</div>

<script>
/*ENGINE*/
/*LEVELS*/
const PAR = /*PAR*/[];
const ATLAS = /*ATLAS*/{};
(function () {
  'use strict';
  const $ = s => document.querySelector(s);
  const PARSED = LEVELS.map(WP.parseLevel);
  PARSED.forEach((l, i) => { l.id = i + 1; });
  const isText = WP.isText, wordOf = WP.wordOf;
  const MSG = {
    order: 'じゅんばんが ちがうよ。えいごは「だれが → どうする → なにを」の じゅんばん!',
    beI: 'I の あとは AM だよ。(I AM ~)',
    amNotI: 'AM は I だけ。ほかは IS (ひとつ) か ARE (ふたつ いじょう)。',
    areOne: 'ひとつ だけ なら ARE じゃなくて IS だよ。',
    isMany: 'AND で ふたつ いじょう なら IS じゃなくて ARE だよ。',
    wantS: 'he / she / なまえ の ときは WANTS (s が つく!)',
    wantsI: 'I の ときは WANTS じゃなくて WANT だよ。',
    wantsMany: 'ふたつ いじょう (AND) の ときは WANT だよ。',
    haveS: 'he / she / なまえ の ときは HAS だよ。',
    hasI: 'I の ときは HAS じゃなくて HAVE だよ。',
    hasMany: 'ふたつ いじょう (AND) の ときは HAVE だよ。',
    nosense: 'その ならびは ぶんに ならないよ。'
  };
  const FONT = '"Arial Rounded MT Bold","Hiragino Maru Gothic ProN","M PLUS Rounded 1c","Noto Sans JP","Meiryo","Trebuchet MS",system-ui,sans-serif';
  const BLK = { pro: 'noun', noun: 'noun', is: 'gram', am: 'gram', are: 'gram', can: 'gram', cant: 'gram', want: 'gram', wants: 'gram', have: 'gram', has: 'gram', and: 'gram', not: 'not', verb: 'verb', adj: 'adj' };
  const CHAR = { BOY: 'I', GIRL: 'GIRL', DOG: 'DOG', CAT: 'CAT', MONKEY: 'MONKEY' };
  const PROP_JP = { BIG: 'おおきい: とおれない', SMALL: 'ちいさい: おせる', LOW: 'ひくい: うえを とおれる', HOT: 'あつい: つめたい ものを とかす', COLD: 'つめたい: あつい ものに とける', OPEN: 'あいている: しまっている ものと きえる', CLOSED: 'しまっている: とおれない', HUNGRY: 'はらぺこ: あなたや たべものを たべる', SLEEPY: 'ねむい: うごかない' };

  // ---------- images ----------
  const IMG = {};
  const loaded = Promise.all(Object.keys(ATLAS).filter(k => k[0] !== '_' && k.slice(0, 2) !== 's_').map(k => new Promise(res => {
    const im = new Image(); im.onload = im.onerror = res; im.src = ATLAS[k]; IMG[k] = im;
  })));
  const src = k => ATLAS[k] || '';
  const heroSprite = t => (CHAR[t] || 'I') + '_idle';

  // ---------- practice levels (tutorial) ----------
  const PRP = [
    { title: 'れんしゅう 1：あるこう', gp: 'うごく れんしゅう', hero: 'BOY', tip: '↑ ↓ ← → キーで あるこう。⭐ に さわったら クリア!', hint: '⭐ まで あるいていこう。', words: [], map: ['#########', '#B......#', '#.......#', '#......S#', '#########'] },
    { title: 'れんしゅう 2：おしてみよう', gp: 'ブロックを おす', hero: 'BOY', tip: 'ブロックに ぶつかると、おせるよ。みちを あけて ⭐ へ!', hint: 'ブロックを みぎへ おして、へやの なかまで いれよう。', words: ['DOG'],
      map: ['##########', '#####....#', '#B.*.....#', '#####...S#', '##########'] }
  ].map(d => { const l = WP.parseLevel(d); l.id = 'P'; return l; });

  let mode = 'main';
  let idx = 0, L, st, hist, moves, locked, soundOn = false, hintOn = false, T = 64, FW = 16, R = null, won = false;
  let cleared = new Set(), found = {};
  try { cleared = new Set(JSON.parse(localStorage.getItem('wordpush_cleared2') || '[]')); } catch (e) {}
  try { found = JSON.parse(localStorage.getItem('wordpush_found') || '{}') || {}; } catch (e) {}
  try { if (localStorage.getItem('wordpush_nojp') === '1') document.body.classList.add('nojp'); } catch (e) {}
  try { soundOn = localStorage.getItem('wordpush_sound') === '1'; } catch (e) {}
  const save = () => { try { localStorage.setItem('wordpush_cleared2', JSON.stringify([...cleared])); localStorage.setItem('wordpush_found', JSON.stringify(found)); } catch (e) {} };
  const chipHTML = w => '<b class="chip t-' + WP.WORDS[w].t + '">' + w + '</b>';
  const sentHTML = text => text.split(' ').map(chipHTML).join('');
  const rnd = (a, b) => a + Math.random() * (b - a);
  const hash = (x, y, n) => { let h = (x * 374761393 + y * 668265263 + n * 2147483647) | 0; h = (h ^ (h >>> 13)) * 1274126177 | 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

  function skin() {
    const ic = (k) => '<img class="ic" src="' + src(k) + '">';
    const lab = { bMenu: ['i_home', 'メニュー'], bHow: ['i_info', 'あそびかた を みる'], bBook: ['i_check', 'ぶん ずかん'], bHow2: ['i_info', 'あそびかた'], bHint: ['i_hint', 'ヒント'], bUndo: ['i_undo', 'もどす'], bReset: ['i_restart', 'やりなおし'], bJp: ['i_info', 'にほんご'], bSnd: [soundOn ? 'i_on' : 'i_off', soundOn ? 'おと ON' : 'おと OFF'], bWait: ['i_next', 'まつ'], tSkip: ['i_next', 'スキップ'], tBack: ['i_left', 'もどる'], tNext: ['i_right', 'つぎへ'] };
    Object.keys(lab).forEach(id => { const e = $('#' + id); if (e) e.innerHTML = ic(lab[id][0]) + lab[id][1]; });
    [['dU', 'i_up'], ['dL', 'i_left'], ['dR', 'i_right'], ['dD', 'i_down']].forEach(([id, k]) => { $('#' + id).innerHTML = ic(k); });
    const lg = $('#logo'); lg.innerHTML = '';
    const cols = ['#ff7a3c', '#ffc933', '#57c878', '#4cb8ff', '#ff7aa2'];
    'Word Push!'.split('').forEach((c, i) => {
      const s = document.createElement('span'); s.textContent = c; if (c === ' ') s.className = 'sp';
      s.style.color = cols[i % cols.length]; s.style.animationDelay = (i * 0.12) + 's'; lg.appendChild(s);
    });
  }

  // ---------- menu ----------
  function buildMenu() {
    const g = $('#levelGrid'); g.innerHTML = '';
    let ch = 0;
    PARSED.forEach((lv, i) => {
      if (lv.chapter !== ch) {
        ch = lv.chapter; const h = document.createElement('div'); h.className = 'chap';
        h.textContent = (typeof CHAPTERS !== 'undefined' ? CHAPTERS[ch - 1] : ch); g.appendChild(h);
      }
      const b = document.createElement('button'); b.className = 'card' + (lv.sandbox ? ' sand' : '');
      b.innerHTML = '<span class="n">' + lv.id + '</span><img class="h" src="' + src(heroSprite(lv.hero)) + '">' +
        '<div class="ti">' + lv.title + '</div><span class="gp">' + lv.gp + '</span>' +
        (cleared.has(lv.title) ? '<img class="done" src="' + src('star_on') + '">' : '');
      b.onclick = () => startLevel(i);
      g.appendChild(b);
    });
    $('#bookCount').textContent = Object.keys(found).filter(k => k[0] !== '!').length;
  }
  function showMenu() {
    buildMenu(); $('#game').classList.add('hidden'); $('#win').classList.add('hidden'); $('#card').classList.add('hidden'); $('#menu').classList.remove('hidden'); L = null;
    try { history.replaceState(null, '', location.pathname); } catch (e) {}
  }

  // ---------- level ----------
  let A = {}; // animation state by object id
  function syncAnim(fresh) {
    const ids = new Set();
    st.objs.forEach(o => {
      ids.add(o.id);
      let a = A[o.id];
      if (!a || fresh) A[o.id] = a = { x: o.x, y: o.y, sq: 0, pop: fresh ? 0 : .35, hop: 0, bump: 0, face: 1, t: o.t };
      if (a.t !== o.t) { a.pop = .4; a.t = o.t; }
    });
    Object.keys(A).forEach(id => { if (!ids.has(+id)) delete A[id]; });
  }
  function startLevel(i, practice) {
    mode = practice ? 'pr' : 'main'; idx = i; L = (practice ? PRP : PARSED)[i]; st = L.st0; hist = []; moves = 0; locked = false; hintOn = false; won = false;
    $('#menu').classList.add('hidden'); $('#win').classList.add('hidden'); $('#game').classList.remove('hidden');
    if (!practice) { try { history.replaceState(null, '', '#level=' + L.id); } catch (e) {} }
    $('#ttl').innerHTML = (practice ? '' : 'Level ' + L.id + '：') + L.title + '<small>' + L.gp + '</small>';
    $('#bWait').classList.toggle('hidden', !L.hasRun);
    parts.length = 0; toasts.length = 0; A = {}; $('#toast').classList.remove('show');
    syncAnim(true); layout(); refresh(true);
    if (L.intro && INTRO[L.intro] && mode === 'main') showCard(INTRO[L.intro]);
  }
  function layout() {
    if (!L) return;
    const wrap = $('#boardWrap'); const aw = wrap.clientWidth - 6, ah = wrap.clientHeight - 6;
    T = Math.max(26, Math.min(84, Math.floor(Math.min((aw - 2 * FW) / L.w, (ah - 2 * FW) / L.h))));
    const cv = $('#cv'), dpr = Math.min(2, window.devicePixelRatio || 1);
    const w = T * L.w + 2 * FW, h = T * L.h + 2 * FW;
    cv.style.width = w + 'px'; cv.style.height = h + 'px'; cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  // ---------- rules → screen ----------
  let status = {}, prevOk = new Set();
  function youTypes() { return [...new Set(st.objs.filter(o => R.isYou(o)).map(o => o.t))]; }
  function refresh(quiet) {
    R = WP.rulesOf(L, st);
    const ok = new Set(), soft = new Set(), bad = new Set();
    R.sentences.forEach(s => s.ids.forEach(id => (s.effect ? ok : soft).add(id)));
    R.bad.forEach(b => b.ids.forEach(id => bad.add(id)));
    status = {};
    st.objs.forEach(o => { if (isText(o.t)) status[o.id] = ok.has(o.id) ? 'ok' : soft.has(o.id) ? 'soft' : (moves > 0 && bad.has(o.id)) ? 'bad' : ''; });
    if (!quiet) {
      const fresh = [...ok].filter(id => !prevOk.has(id));
      if (fresh.length) { sfx('rule'); fresh.forEach(id => { const o = st.objs.find(p => p.id === id); for (let k = 0; k < 6; k++) spark(o.x + .5, o.y + .5, '#fff27a'); }); }
    }
    prevOk = ok;
    // discoveries
    if (mode === 'main' && moves > 0) R.sentences.forEach(s => {
      if (!found[s.text]) { found[s.text] = WP.sentenceJP(s); save(); toast('はじめての ぶん!', s.text, WP.sentenceJP(s)); }
    });
    // side panel
    const yt = youTypes();
    $('#hImg').src = src(heroSprite(yt[0] || L.hero));
    $('#hImg').style.visibility = yt.length ? 'visible' : 'hidden';
    $('#hText').innerHTML = yt.length ? 'あなたは <b>' + yt.map(t => t + ' (' + WP.WORDS[t].jp + ')' + (st.objs.filter(o => o.t === t).length > 1 ? ' ×' + st.objs.filter(o => o.t === t).length : '')).join(' と ') + '</b>'
      : '<b style="color:#c4271e">だれも いない!</b><br>もどす(Z) で もどろう';
    const box = $('#sents');
    if (!R.sentences.length) box.innerHTML = '<div class="none">ブロックを ならべて ぶんを つくろう</div>';
    else box.innerHTML = R.sentences.map(s => {
      const note = s.effect ? '✓ はたらいている!' : '○ ぶんは OK。でも ここに いないよ';
      return '<div class="sent ' + (s.effect ? 'ok' : '') + '"><div class="row">' + sentHTML(s.text) + '</div>' +
        '<div class="jp">' + WP.sentenceJP(s) + '</div><div class="note">' + note + '</div></div>';
    }).join('');
    // nature rules for things on the board
    const types = [...new Set(st.objs.filter(o => !isText(o.t)).map(o => o.t))];
    const nat = types.filter(t => WP.NATURE_JP[t]).map(t => {
      const e = WP.eff(R, t); const def = (WP.DEFAULTS[t] || []).concat(WP.DEF_ABIL[t] || []);
      const off = def.length && def.every(d => !(e.p.has(d) || e.ab.has(d)));
      return '<li class="' + (off ? 'off' : '') + '">' + WP.NATURE_JP[t] + '</li>';
    });
    $('#nature').innerHTML = nat.join('');
    $('#natPanel').classList.toggle('hidden', !nat.length);
    const m = $('#msg'); m.className = 'panel';
    if (!yt.length && moves > 0) { m.classList.add('warn'); m.textContent = 'だれも うごかせない! もどす (Z) か やりなおし (R) で もどろう。'; }
    else if (R.conflicts.length) { m.classList.add('warn'); m.textContent = '⚠ はんたいの ことばが ぶつかって、きえちゃった! (' + R.conflicts.join(', ') + ')'; }
    else if (R.bad.length && moves > 0) { m.classList.add('warn'); m.innerHTML = '✗ ' + sentHTML(R.bad[0].text) + '<br>' + MSG[R.bad[0].code]; }
    else if (hintOn) { m.classList.add('hint'); m.textContent = '💡 ' + L.hint; }
    else m.textContent = L.tip;
  }

  // ---------- input ----------
  function go(dir) {
    if (locked || !L || !$('#card').classList.contains('hidden')) return;
    if (dir === 'W' && !L.hasRun) return;
    const info = {};
    const prevYou = st.objs.filter(o => R.isYou(o));
    const ns = WP.move(L, st, dir === 'W' ? null : dir, info);
    if (!ns) {
      prevYou.forEach(o => { const a = A[o.id]; if (a) { a.bump = .35; a.bdx = (WP && { L: -1, R: 1 }[dir]) || 0; if (dir === 'L' || dir === 'R') a.face = dir === 'L' ? -1 : 1; } });
      sfx('bump'); return;
    }
    hist.push(st); st = ns; moves++;
    prevYou.forEach(o => { const a = A[o.id]; if (a && (dir === 'L' || dir === 'R')) a.face = dir === 'L' ? -1 : 1; });
    (info.moved || new Set()).forEach(id => { const a = A[id]; if (a) a.hop = .24; });
    let snd = 'step';
    info.events.forEach(ev => {
      if (ev.k === 'push') { snd = 'push'; ev.ids.forEach(id => { const a = A[id]; if (a) a.sq = .25; const o = st.objs.find(p => p.id === id); if (o) dust(o.x + .5, o.y + .5); }); }
      else if (ev.k === 'hop') { const a = A[ev.id]; if (a) { a.hop = .32; a.big = 1; } }
      else if (ev.k === 'xf') { const o = st.objs.find(p => p.id === ev.id); if (o) poof(o.x + .5, o.y + .5); discover('xf:' + ev.from + '>' + ev.to, 'へんしん!', ev.from + ' → ' + ev.to, WP.WORDS[ev.from].jp + 'が ' + WP.WORDS[ev.to].jp + 'に なった!'); }
      else if (ev.k === 'spawn') { const o = st.objs.find(p => p.id === ev.id); if (o) { for (let k = 0; k < 8; k++) spark(o.x + .5, o.y + .5, '#fff27a'); if (ev.has) discover('has:' + o.t, 'でてきた!', o.t, WP.WORDS[o.t].jp + 'が でてきた!'); } }
      else if (ev.k === 'sink') { for (let k = 0; k < 14; k++) splash(ev.x + .5, ev.y + .5); snd = 'push'; if (ev.you) discover('!sink', 'ぶくぶく…', ev.t, 'しずんじゃった!'); }
      else if (ev.k === 'melt') { steam(ev.x + .5, ev.y + .5); discover('!melt:' + ev.t, 'とけた!', ev.t, WP.WORDS[ev.t].jp + 'が とけちゃった!'); }
      else if (ev.k === 'burn') { steam(ev.x + .5, ev.y + .5); P({ x: ev.x + .5, y: ev.y + .3, vy: -.6, life: 1, max: 1, size: .3, kind: 'text', text: 'あちっ!', color: '#ff6a00' }); discover('!burn', 'あちっ!', ev.t, 'やけど しちゃった!'); }
      else if (ev.k === 'open') { poof(ev.x + .5, ev.y + .5); snd = 'open'; }
      else if (ev.k === 'vanish') { poof(ev.x + .5, ev.y + .5); snd = 'open'; discover('!vanish:' + ev.t, 'きえた!', ev.t, WP.WORDS[ev.t].jp + 'が ぜんぶ きえちゃった! (' + ev.t + ' IS NOT ' + ev.t + ')'); }
      else if (ev.k === 'eat') { chomp(ev.x + .5, ev.y + .5); if (ev.you) discover('!eaten', 'ぱくっ!', ev.t, 'たべられちゃった!'); else discover('!ate:' + ev.t, 'ぱくっ!', ev.t, WP.WORDS[ev.t].jp + 'を たべた!'); }
    });
    syncAnim(false);
    sfx(snd);
    const oldYou = new Set(prevYou.map(o => o.t));
    refresh();
    const yt = youTypes();
    yt.forEach(t => { if (!oldYou.has(t)) { const o = st.objs.find(p => p.t === t); if (o) poof(o.x + .5, o.y + .5); discover('you:' + t, 'あなたは ' + t + '!', 'I AM ' + t, 'わたしは ' + WP.WORDS[t].jp + '!'); } });
    if (WP.isWin(L, st, R)) win();
  }
  function discover(key, head, en, jp) {
    if (mode !== 'main') { return; }
    if (!found[key]) { found[key] = jp; save(); toast('ふしぎ はっけん! ' + head, null, jp); }
  }
  function undo() { if (locked || !hist.length) return; st = hist.pop(); moves = Math.max(0, moves - 1); syncAnim(false); refresh(true); sfx('back'); }
  function restart() { if (!L) return; st = L.st0; hist = []; moves = 0; locked = false; hintOn = false; won = false; $('#win').classList.add('hidden'); A = {}; syncAnim(true); refresh(true); }

  function win() {
    locked = true; won = true; if (mode === 'main') { cleared.add(L.title); save(); } sfx('win');
    const yous = st.objs.filter(o => R.isYou(o));
    yous.forEach(o => { const a = A[o.id]; if (a) a.cheer = 1; for (let k = 0; k < 30; k++) confettiP(o.x + .5, o.y + .3); });
    const self = yous.find(o => R.wants.some(([w, x]) => (w === '@you' || w === o.t) && x === o.t) || o.t === 'STAR');
    if (self) discover('!self', 'じぶんが ほしい!', '', 'ほしい ものが じぶん だった!');
    const who = (yous[0] && yous[0].t) || L.hero;
    const pic = src((CHAR[who] || 'I') + '_cheer') || src(heroSprite(who));
    if (mode === 'pr') {
      const lastP = idx >= PRP.length - 1;
      setTimeout(() => {
        if (!won) return;
        $('#winbox').innerHTML = '<h2>できた!</h2><img class="hero" src="' + pic + '">' +
          '<div class="stat" style="font-size:19px;margin:8px 0 12px">' + (lastP ? 'すごい! じゃあ、ほんばんに いこう!' : 'いいね! つぎの れんしゅうへ!') + '</div>' +
          '<div class="btns"><button class="sbtn blue" id="wMenu">メニュー</button><button class="sbtn red" id="wAgain">もういちど</button><button class="sbtn green" id="wNext">' + (lastP ? 'Level 1 へ ▶' : 'つぎへ ▶') + '</button></div>';
        $('#win').classList.remove('hidden');
        $('#wMenu').onclick = showMenu; $('#wAgain').onclick = restart;
        $('#wNext').onclick = () => lastP ? startLevel(0) : startLevel(idx + 1, true);
      }, 800);
      return;
    }
    const par = PAR[idx] || moves;
    const stars = moves <= par * 1.4 ? 3 : moves <= par * 2.5 ? 2 : 1;
    const sents = R.sentences.filter(s => s.effect).map(s =>
      '<div class="sent ok"><div class="row">' + sentHTML(s.text) + '</div><div class="jp">' + WP.sentenceJP(s) + '</div></div>').join('');
    const last = idx >= PARSED.length - 1;
    setTimeout(() => {
      if (!won) return;
      $('#winbox').innerHTML = '<h2>できた!</h2><img class="hero" src="' + pic + '">' +
        '<div class="stars">' + [0, 1, 2].map(i => '<img src="' + src(i < stars ? 'star_on' : 'star_off') + '">').join('') + '</div>' +
        '<div class="stat">' + moves + ' て (ベスト ' + par + ' て)　ほかの やりかたも あるかも!</div><div class="wsents">' + sents + '</div>' +
        '<div class="btns"><button class="sbtn blue" id="wMenu">メニュー</button><button class="sbtn red" id="wAgain">もういちど</button>' +
        (last ? '' : '<button class="sbtn green" id="wNext">つぎへ ▶</button>') + '</div>';
      $('#win').classList.remove('hidden');
      $('#wMenu').onclick = showMenu; $('#wAgain').onclick = restart;
      if (!last) $('#wNext').onclick = () => startLevel(idx + 1);
    }, 1000);
  }

  // ---------- new word cards ----------
  const tbH = w => { const c = BLK[WP.WORDS[w].t]; return '<span class="tb"><img src="' + src('blk_' + c) + '"><b>' + w + '</b></span>'; };
  const rowH = ws => '<div class="row">' + ws.map(tbH).join('') + '</div>';

    } else if (t === 'WALL') { const k = e.p.has('LOW') ? 'lowwall' : 'wall'; ctx.drawImage(IMG[k], -T / 2 - .5, -T * .94, T + 1, T + 1); }

    else if (t === 'DOOR') { const k = e.p.has('CLOSED') && !e.p.has('LOW') ? 'door_closed' : 'door_open'; ctx.drawImage(IMG[k], -T / 2 - .5, -T * .94, T + 1, T + 1); }
    else if (t === 'TREE') drawTree(0, 0, T);
    else if (t === 'ICE') drawIce(0, 0, T);
    else if (t === 'FLOWER') drawFlower(0, 0, T, time);
    else if (t === 'ROCK') fitImg('rock', 0, 0, T * .9, T * .8);
    else if (t === 'KEY') { ctx.rotate(Math.sin(time * 3 + o.id) * .1); fitImg('key', 0, -T * .1, T * .7, T * .6); }
    else if (t === 'FIRE') fitImg(e.p.has('HOT') ? 'torch' + f2 : 'torch_off', 0, 0, T * .8, T * .95);
    else if (t === 'FISH') fitImg('fish' + f2, 0, -T * .1, T * .8, T * .7);
    else if (t === 'FROG') fitImg(a.hop > 0 ? 'frog1' : 'frog0', 0, 0, T * .8, T * .75);
    else if (t === 'MOUSE') fitImg('mouse' + (run ? f2 : 0), 0, 0, T * .8, T * .7);
    else { // star + food
      const bob = Math.sin(time * 3 + o.x * 1.3 + o.y) * T * .05, sc = 1 + Math.sin(time * 4 + o.x) * .04;
      fitImg(t === 'STAR' ? 'star' : t.toLowerCase(), 0, -T * .08 + bob, T * .8 * sc, T * .8 * sc);
    }
    ctx.shadowBlur = 0;
    ctx.restore();
    // status icons
    if (e.p.has('SLEEPY')) { ctx.font = '900 ' + (T * .26) + 'px ' + FONT; ctx.fillStyle = '#4a6fb8'; ctx.textAlign = 'left'; ctx.fillText('Zz', cx + T * .2, by - T * .85 - Math.sin(time * 2) * 3); }
    if (run) { ctx.strokeStyle = 'rgba(255,255,255,.8)'; ctx.lineWidth = 3; const d = { L: 1, R: -1, U: 0, D: 0 }[o.d]; if (d) for (let k = 0; k < 3; k++) { ctx.beginPath(); const yy = by - T * (.25 + k * .2); ctx.moveTo(cx + d * T * .38, yy); ctx.lineTo(cx + d * T * (.55 + (time * 3 % .2)), yy); ctx.stroke(); } }
    if (ex.has('CLOSED') && t !== 'DOOR') { ctx.font = (T * .3) + 'px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('🔒', cx + T * .3, by - T * .7); }
  }

  function drawYouMark(o, time) {
    const a = A[o.id] || o; const cx = (a.x + .5) * T, y = a.y * T - T * .12 + Math.sin(time * 5) * 3;
    ctx.save(); ctx.fillStyle = '#ff4f9a'; ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx - T * .12, y - T * .1); ctx.lineTo(cx + T * .12, y - T * .1); ctx.lineTo(cx, y + T * .04); ctx.closePath(); ctx.stroke(); ctx.fill();
    ctx.font = '900 ' + (T * .2) + 'px ' + FONT; ctx.textAlign = 'center'; ctx.lineWidth = 3; ctx.strokeText('I', cx, y - T * .14); ctx.fillText('I', cx, y - T * .14);
    ctx.restore();
  }

  function drawBlock(o, time) {
    const a = A[o.id] || { x: o.x, y: o.y, sq: 0 }; const w = wordOf(o.t), d = WP.WORDS[w], s = status[o.id];
    const col = BLK[d.t], x = a.x * T, y = a.y * T; let sh = 0;
    if (s === 'bad') sh = Math.sin(time * 50) * 2.5;
    const sc = 1 + Math.sin((a.sq || 0) * 12.5) * .12;
    const cx = x + T / 2 + sh, cy = y + T / 2;
    ctx.save();
    shadow(cx, y + T * .92, T * .4, .25);
    ctx.translate(cx, cy); ctx.scale(sc, 2 - sc);
    if (s === 'ok') { ctx.shadowColor = '#43ff7a'; ctx.shadowBlur = 16 + Math.sin(time * 6) * 4; }
    else if (s === 'soft') { ctx.shadowColor = '#6cc6ff'; ctx.shadowBlur = 11; }
    else if (s === 'bad') { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 14; }
    const im = IMG['blk_' + col]; const bs = T - 4;
    if (im && im.naturalWidth) { const bh = bs * im.naturalHeight / im.naturalWidth; ctx.drawImage(im, -bs / 2, -bh / 2, bs, bh); if (s) ctx.drawImage(im, -bs / 2, -bh / 2, bs, bh); }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    const jp = !document.body.classList.contains('nojp');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const sz = fitText(w, bs * .8, T * (w.length <= 3 ? .36 : .3), 900); const ty = jp ? -T * .08 : 0;
    ctx.lineWidth = Math.max(3, sz * .24); ctx.strokeStyle = '#1d2a38'; ctx.strokeText(w, 0, ty); ctx.fillStyle = '#fff'; ctx.fillText(w, 0, ty);
    if (jp) { const jsz = fitText(d.jp, bs * .8, T * .17, 900); ctx.lineWidth = Math.max(2, jsz * .22); ctx.strokeStyle = '#1d2a38'; ctx.strokeText(d.jp, 0, T * .24); ctx.fillStyle = '#fff6c9'; ctx.fillText(d.jp, 0, T * .24); }
    ctx.restore();
  }

  // ---------- background ----------
  const bgc = $('#bg'), bctx = bgc.getContext('2d'); let bgW = 0, bgH = 0; const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: .05 + Math.random() * .3, s: .6 + Math.random() * .8, v: .004 + Math.random() * .006 }));
  function drawBg(time) {
    const dpr = 1; const W = innerWidth, H = innerHeight;
    if (W !== bgW || H !== bgH) { bgW = bgc.width = W; bgH = bgc.height = H; }
    const g = bctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5cc4ff'); g.addColorStop(.6, '#bfeaff'); g.addColorStop(1, '#e8fbff'); bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
    // sun
    const sg = bctx.createRadialGradient(W * .85, H * .16, 10, W * .85, H * .16, 150); sg.addColorStop(0, 'rgba(255,248,190,1)'); sg.addColorStop(.25, 'rgba(255,240,150,.8)'); sg.addColorStop(1, 'rgba(255,240,150,0)'); bctx.fillStyle = sg; bctx.fillRect(0, 0, W, H);
    // clouds
    clouds.forEach(c => {
      c.x += c.v / 60; if (c.x > 1.2) c.x = -.2; const x = c.x * W, y = c.y * H, s = c.s * 60;
      bctx.fillStyle = 'rgba(255,255,255,.92)'; bctx.beginPath(); bctx.arc(x, y, s * .6, 0, 7); bctx.arc(x + s * .6, y - s * .2, s * .7, 0, 7); bctx.arc(x + s * 1.3, y, s * .6, 0, 7); bctx.arc(x + s * .65, y + s * .2, s * .6, 0, 7); bctx.fill();
    });
    // hills (parallax)
    const hill = (base, amp, freq, speed, col) => { bctx.fillStyle = col; bctx.beginPath(); bctx.moveTo(0, H); for (let x = 0; x <= W; x += 12) bctx.lineTo(x, H * base + Math.sin(x * freq + time * speed) * amp + Math.sin(x * freq * 2.3 + 1) * amp * .35); bctx.lineTo(W, H); bctx.closePath(); bctx.fill(); };
    hill(.68, 26, .006, .03, '#8fd97a'); hill(.78, 22, .008, .05, '#6ccb5f'); hill(.88, 16, .011, .08, '#4fb84f');
  }

  // ---------- main loop ----------
  let last = performance.now(), frame = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const time = now / 1000; frame++;
    if (frame % 2 === 0 || !L) drawBg(time);
    if (L && !$('#game').classList.contains('hidden')) {
      const k = 1 - Math.exp(-dt * 20);
      st.objs.forEach(o => { const a = A[o.id]; if (!a) return; a.x += (o.x - a.x) * k; a.y += (o.y - a.y) * k; ['sq', 'hop', 'bump', 'pop'].forEach(f => { if (a[f] > 0) a[f] = Math.max(0, a[f] - dt); }); if (!a.hop) a.big = 0; });
      drawBoard(time, dt);
    }
    requestAnimationFrame(loop);
  }

  // ---------- sfx ----------
  let ac = null; const SND = {};
  function loadSnd() {
    if (SND._l) return; SND._l = 1;
    ['step', 'push', 'bump', 'win', 'rule', 'open', 'ui', 'back'].forEach(n => {
      try { const b = atob(ATLAS['s_' + n].split(',')[1]); const u = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); ac.decodeAudioData(u.buffer, buf => { SND[n] = buf; }, () => {}); } catch (e) {}
    });
  }
  const VOL = { step: .3, push: .7, bump: .45, win: .8, rule: .6, open: .7, ui: .5, back: .5 };
  function sfx(kind) {
    if (!soundOn) return;
    try {
      ac = ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state === 'suspended') ac.resume(); loadSnd();
      const b = SND[kind]; if (!b) return; const g = ac.createGain(); g.gain.value = VOL[kind] || .5;
      const sn = ac.createBufferSource(); sn.buffer = b; sn.connect(g); g.connect(ac.destination); sn.start();
    } catch (e) {}
  }
  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.sbtn, .card')) sfx('ui'); });

  document.addEventListener('keydown', e => {
    if (!L || $('#game').classList.contains('hidden')) return;
    const k = e.key.toLowerCase();
    const map = { arrowup: 'U', w: 'U', arrowdown: 'D', s: 'D', arrowleft: 'L', a: 'L', arrowright: 'R', d: 'R' };
    if (!$('#win').classList.contains('hidden')) { if (k === 'enter' && $('#wNext')) $('#wNext').click(); return; }
    if (!$('#card').classList.contains('hidden')) { if (k === 'enter' || k === ' ') { e.preventDefault(); $('#cardOk').click(); } return; }
    if (map[k]) { e.preventDefault(); go(map[k]); }
    else if (k === ' ' || k === '.') { e.preventDefault(); go('W'); }
    else if (k === 'z' || k === 'u' || k === 'backspace') { e.preventDefault(); undo(); }
    else if (k === 'r') restart();
    else if (k === 'h') { hintOn = !hintOn; refresh(true); }
    else if (k === 'escape') showMenu();
  });
  document.querySelectorAll('#dpad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); go(b.dataset.d); }));
  let tx = 0, ty = 0;
  $('#boardWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('#boardWrap').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); }, { passive: true });
  $('#bMenu').onclick = showMenu; $('#bWait').onclick = () => go('W'); $('#bUndo').onclick = undo; $('#bReset').onclick = restart;
  $('#bHint').onclick = () => { hintOn = !hintOn; refresh(true); };
  $('#bJp').onclick = () => { document.body.classList.toggle('nojp'); try { localStorage.setItem('wordpush_nojp', document.body.classList.contains('nojp') ? '1' : '0'); } catch (e) {} };
  $('#bSnd').onclick = () => { soundOn = !soundOn; try { localStorage.setItem('wordpush_sound', soundOn ? '1' : '0'); } catch (e) {} $('#bSnd').innerHTML = '<img class="ic" src="' + src(soundOn ? 'i_on' : 'i_off') + '">' + (soundOn ? 'おと ON' : 'おと OFF'); sfx('step'); };
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#boardWrap'));


  // ---------- tutorial ----------
  const tb = w => { const c = BLK[WP.WORDS[w].t]; return '<span class="tb"><img src="' + src('blk_' + c) + '"><b>' + w + '</b></span>'; };
  const im = (k, c) => '<img class="' + (c || 's') + '" src="' + src(k) + '">';
  const lab = (t, c) => '<span class="lab" style="background:' + c + '">' + t + '</span>';
  const col = (inner, label) => '<div class="vcol">' + inner + (label || '') + '</div>';
  const SL = [
    { t: 'ようこそ!', g: 'cheer', say: 'こんにちは! いっしょに あそぼう!<small>⭐ に さわったら クリア だよ。</small>', vis: () => im('I_idle', 'hh') + '<span class="arrow">▶ ▶ ▶</span>' + im('star', 'hh') },
    { t: 'あるきかた', g: 'idle', say: '<em>↑ ↓ ← →</em> の キーで あるくよ。<small>W A S D でも いいよ。スマホは ゆびで スワイプ!</small>',
      vis: () => '<div style="position:relative;width:200px;height:130px">' + [['i_up', 74, 0], ['i_left', 14, 62], ['i_down', 74, 62], ['i_right', 134, 62]].map(a => '<img src="' + src(a[0]) + '" style="position:absolute;width:56px;padding:12px;background:#1b8ff0;border:4px solid #0b4a96;border-radius:50%;box-sizing:border-box;left:' + a[1] + 'px;top:' + a[2] + 'px">').join('') + '</div>' },
    { t: 'ブロックを おしてみよう', g: 'hop', say: 'ブロックに ぶつかると、<em>おせる</em>よ!<small>ブロックには ことばが かいて あるよ。</small>',
      vis: () => im('I_idle', 'hh') + tb('CAT') + '<span class="arrow">▶</span>' + '<span style="width:24px"></span>' + tb('CAT') },
    { t: 'ブロックは ことば!', g: 'idle', say: 'ブロックの いろには いみが あるよ。<small>ならべて、えいごの ぶんを つくろう!</small>',
      vis: () => [['DOG', 'なまえ', '#3d8be0'], ['CAN', 'つなぐ', '#e3a914'], ['SWIM', 'うごき', '#e2494b'], ['OPEN', 'ようす', '#2fb36a']].map(a => col(tb(a[0]), lab(a[1], a[2]))).join('') },
    { t: 'えいごの ならびかた', g: 'cheer', say: 'えいごは <em>S → V → O</em> の じゅんばん!<small>S＝だれが　V＝どうする　O＝なにを</small>',
      vis: () => '<div class="row">' + col(tb('I'), lab('S だれが', '#3d8be0')) + col(tb('WANT'), lab('V どうする', '#e3a914')) + col(tb('APPLE'), lab('O なにを', '#3d8be0')) + '<span class="eq">＝ わたしは リンゴが ほしい</span></div>' },
    { t: 'じゅんばん だいじ!', g: 'bump', say: 'ならびが ちがうと、ぶんに ならないよ。<small>にほんごと ちがうから、きを つけてね。</small>',
      vis: () => '<div class="vcol" style="gap:14px"><div class="row"><span class="ok">○</span>' + tb('I') + tb('WANT') + tb('APPLE') + '</div><div class="row"><span class="ng">×</span>' + tb('APPLE') + tb('WANT') + tb('I') + '</div></div>' },
    { t: 'よむ むき', g: 'idle', say: 'ぶんは <em>ひだり → みぎ</em>、<em>うえ → した</em> に よむよ。<small>ブロックは たてにも ならべられるよ。</small>',
      vis: () => '<div class="row">' + tb('DOG') + tb('CAN') + tb('SWIM') + '</div><span style="width:30px"></span><div class="vcol">' + tb('DOG') + tb('CAN') + tb('SWIM') + '</div>' },
    { t: 'ぶんが できると…', g: 'cheer', say: 'ぶんが できると、<b class="g">みどりに ひかる</b>よ。<small>ふしぎな ちからが でるよ! たとえば DOOR IS OPEN → ドアが あく!</small>',
      vis: () => im('door_closed', 'hh') + '<span class="arrow">▶</span>' + '<div class="row">' + tb('DOOR') + tb('IS') + tb('OPEN') + '</div><span class="arrow">▶</span>' + im('door_open', 'hh') },
    { t: 'ことばで せかいが かわる!', g: 'cheer', say: 'ぶんを かえると、<em>ふしぎな こと</em>が おこるよ!<small>I AM DOG → あなたが イヌに!　WALL IS STAR → かべが ほしに!　いろいろ ためして みよう。⭐ への みちは 1つ じゃないよ。</small>',
      vis: () => '<div class="vcol">' + '<div class="row">' + tb('I') + tb('AM') + tb('DOG') + '</div>' + im('DOG_cheer', 's') + '</div><div class="vcol"><div class="row">' + tb('WALL') + tb('IS') + tb('STAR') + '</div>' + im('star', 's') + '</div>' },
    { t: 'やさしい えいご', g: 'idle', say: 'この ゲームの えいごは、<em>かんたんに して ある</em>よ。<small>ほんとうの えいごは「The door is open.」みたいに a や the が つくよ。ぜんぶ おおきい もじで かいて あるよ。</small>',
      vis: () => '<div class="vcol"><div class="row">' + tb('DOOR') + tb('IS') + tb('OPEN') + '</div>' + lab('ゲームの えいご', '#e9b81c') + '</div><span class="arrow">≒</span><div class="vcol"><span style="font-size:30px;font-weight:900">The door is open.</span>' + lab('ほんとうの えいご', '#4cb8ff') + '</div>' },
    { t: 'こまった ときは', g: 'bump', say: 'まちがえても だいじょうぶ! なんどでも やりなおせるよ。',
      vis: () => '<div class="vcol"><button class="sbtn green" style="pointer-events:none">もどす</button><b>キー: Z</b></div><div class="vcol"><button class="sbtn red" style="pointer-events:none">やりなおし</button><b>キー: R</b></div><div class="vcol"><button class="sbtn" style="pointer-events:none">ヒント</button><b>キー: H</b></div>' },
    { t: 'れんしゅう しよう!', g: 'cheer', say: 'まず 2つ れんしゅう しよう!<small>そのあと ほんばん。がんばろう!</small>', vis: () => im('I_cheer', 'hh') + im('star', 'hh') + im('DOG_cheer', 'hh') }
  ];
  let ti = 0, tutAfter = null;
  const GKEY = { I: 'I', BOY: 'BOY', GIRL: 'GIRL' };
  function showTut(n) {
    ti = Math.max(0, Math.min(SL.length - 1, n)); const sl = SL[ti];
    $('#tutT').textContent = sl.t; $('#tutImg').src = src('I_' + sl.g);
    $('#tutSay').innerHTML = sl.say; $('#tutVis').innerHTML = sl.vis();
    $('#tutDots').innerHTML = SL.map((_, i) => '<i class="' + (i === ti ? 'on' : '') + '"></i>').join('');
    $('#tBack').style.visibility = ti ? 'visible' : 'hidden';
    const last = ti === SL.length - 1; $('#tNext').innerHTML = '<img class="ic" src="' + src('i_right') + '">' + (last ? 'れんしゅう' : 'つぎへ');
    $('#tSkip').style.visibility = last ? 'hidden' : 'visible';
  }
  function openTut() { $('#tut').classList.remove('hidden'); showTut(0); }
  function closeTut(toPractice) {
    $('#tut').classList.add('hidden'); try { localStorage.setItem('wordpush_tut', '1'); } catch (e) {}
    if (toPractice) startLevel(0, true);
  }
  ['tSkip', 'tBack', 'tNext'].forEach(id => { });
  $('#tSkip').onclick = () => closeTut(false);
  $('#tBack').onclick = () => showTut(ti - 1);
  $('#tNext').onclick = () => { if (ti >= SL.length - 1) closeTut(true); else showTut(ti + 1); };
  $('#bHow').onclick = openTut; $('#bHow2').onclick = openTut;
  $('#bQR').innerHTML = '<span style="display:inline-block;vertical-align:middle;margin-right:6px">' + QRPLAY.icon(24, '#fff') + '</span>QRコード'; $('#bQR').onclick = () => QRPLAY.open();
  document.addEventListener('keydown', e => {
    if ($('#tut').classList.contains('hidden')) return;
    e.stopImmediatePropagation(); e.preventDefault(); if (e.key === 'ArrowRight' || e.key === 'Enter') $('#tNext').click(); else if (e.key === 'ArrowLeft') $('#tBack').click(); else if (e.key === 'Escape') closeTut(false);
  }, true);

  loaded.then(() => {
    skin();
    const m = location.hash.match(/level=(\d+)/);
    if (m && PARSED[+m[1] - 1]) startLevel(+m[1] - 1); else { showMenu(); let seen = '1'; try { seen = localStorage.getItem('wordpush_tut'); } catch (e) {} if (!seen) openTut(); }
    requestAnimationFrame(loop);
  });
  window.__wp = { go, undo, restart, startLevel, openTut, get won() { return won; }, get state() { return { st, moves, idx }; } };
})();
