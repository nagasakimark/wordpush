<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Word Push! ことばブロック</title>
<style>
:root { --bi-brown: none; --ink: #4a2a10; --cream: #fff4d6; --cream2: #ffe9b0; --wood: #a8642a; --woodD: #6b3a12; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; overflow: hidden; background: #7fd2ff; }
body {
  font-family: "Arial Rounded MT Bold", "Hiragino Maru Gothic ProN", "M PLUS Rounded 1c", "Noto Sans JP", "Meiryo", system-ui, sans-serif;
  color: var(--ink); user-select: none; -webkit-user-select: none;
}
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
.hidden { display: none !important; }
button { font: inherit; cursor: pointer; border: 0; padding: 0; background: none; color: inherit; }
.stroke { text-shadow: -2px -2px 0 var(--woodD), 2px -2px 0 var(--woodD), -2px 2px 0 var(--woodD), 2px 2px 0 var(--woodD), 0 3px 0 var(--woodD); }

/* sprite buttons */
.sbtn {
  --c1: #ffe066; --c2: #ff9a14; --bd: #9a4a00;
  position: relative; overflow: hidden; display: inline-flex; align-items: center; justify-content: center; gap: 7px;
  height: 46px; padding: 0 20px; border: 4px solid var(--bd); border-radius: 999px; white-space: nowrap;
  background: linear-gradient(var(--c1), var(--c2)) !important; color: #fff; font-weight: 900; font-size: 16px; letter-spacing: .5px;
  box-shadow: 0 5px 0 var(--bd), 0 9px 8px rgba(0,0,0,.28), inset 0 -4px 0 rgba(0,0,0,.14);
  text-shadow: -1.5px -1.5px 0 var(--bd), 1.5px -1.5px 0 var(--bd), -1.5px 1.5px 0 var(--bd), 1.5px 1.5px 0 var(--bd), 0 2px 0 var(--bd);
  transition: transform .08s, filter .08s; margin-bottom: 5px;
}
.sbtn::before { content: ""; position: absolute; left: 9%; right: 9%; top: 2px; height: 44%; border-radius: 999px; background: linear-gradient(rgba(255,255,255,.8), rgba(255,255,255,.12)); pointer-events: none; }
.sbtn > * { position: relative; }
.sbtn img.ic { height: 20px; margin: 0 -1px 0 0; filter: drop-shadow(0 2px 0 var(--bd)); }
.sbtn.blue { --c1: #7fdcff; --c2: #1b8ff0; --bd: #0b4a96; }
.sbtn.green { --c1: #a6f56e; --c2: #25b516; --bd: #17680d; }
.sbtn.red { --c1: #ff9a8a; --c2: #ec2a34; --bd: #8e0f1c; }
.sbtn.steel { --c1: #e2a8ff; --c2: #8b3fe6; --bd: #4a1a96; }
.sbtn:hover { filter: brightness(1.1) saturate(1.1); transform: translateY(-2px); }
.sbtn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--bd), 0 3px 4px rgba(0,0,0,.28), inset 0 -4px 0 rgba(0,0,0,.14); }
.sbtn.sm { height: 38px; padding: 0 12px; font-size: 13px; } .sbtn.sm img.ic { height: 15px; }

/* chips (same colours as blocks) */
.chip { display: inline-block; min-width: 46px; text-align: center; padding: 2px 8px; border-radius: 99px; font-weight: 900; font-size: 13px; color: #fff;
  border: 2px solid #1d2a38; box-shadow: 0 2px 0 rgba(0,0,0,.25), inset 0 2px 0 rgba(255,255,255,.35);
  text-shadow: 0 1px 0 rgba(70,35,5,.8); }
.t-pro, .t-noun { background: #3d8be0; } .t-can, .t-cant, .t-is, .t-want, .t-wants { background: #e3a914; }
.t-verb { background: #e2494b; } .t-adj { background: #2fb36a; }

/* MENU */
#menu { position: absolute; inset: 0; overflow-y: auto; padding: 10px 18px 20px; text-align: center; z-index: 2; }
#logo { display: flex; justify-content: center; gap: 2px; margin-top: 0; height: 74px; align-items: flex-end; }
#logo span {
  display: inline-block; font-size: 60px; font-weight: 900; line-height: 1; color: #fff; transform-origin: 50% 100%;
  -webkit-text-stroke: 9px var(--woodD); paint-order: stroke fill; text-shadow: 0 6px 0 var(--woodD), 0 10px 6px rgba(0,0,0,.25);
  animation: jig 1.8s ease-in-out infinite;
}
#logo span.sp { width: 18px; }
@keyframes jig { 0%,100% { transform: translateY(0) rotate(-2deg); } 50% { transform: translateY(-8px) rotate(2deg); } }
#menu .sub { text-shadow: -2px -2px 0 #1b6fb0, 2px -2px 0 #1b6fb0, -2px 2px 0 #1b6fb0, 2px 2px 0 #1b6fb0, 0 3px 0 #1b6fb0; margin: 2px 0 6px; font-weight: 900; font-size: 18px; color: #fff; }
.legend { display: flex; gap: 8px; justify-content: center; margin: 0 auto 10px; }
.legend span { font-size: 13px; font-weight: 900; background: rgba(255,255,255,.85); padding: 3px 10px 3px 4px; border-radius: 99px; display: inline-flex; gap: 6px; align-items: center; border: 2px solid var(--woodD); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; max-width: 1280px; margin: 0 auto; padding-bottom: 14px; }
.card { position: relative; height: 106px; border: 4px solid #8a4b14; border-radius: 18px; background: linear-gradient(#fffef2, #ffeeb8); box-shadow: 0 5px 0 #8a4b14, 0 9px 8px rgba(0,0,0,.22), inset 0 3px 0 rgba(255,255,255,.9); transition: transform .08s; color: var(--ink); padding: 0; margin-bottom: 4px; }
.card:hover { transform: translateY(-4px) rotate(-1deg); } .card:active { transform: translateY(3px); } .card:active { transform: translateY(2px); }
.card .n { position: absolute; left: 4px; top: 4px; background: radial-gradient(circle at 35% 30%, #ff9a7a, #e8262b); color: #fff; border-radius: 50%; width: 28px; height: 28px; line-height: 23px; font-weight: 900; font-size: 15px; border: 3px solid #8e0f1c; text-shadow: 0 1px 0 #8e0f1c; }
.card img.h { position: absolute; right: 4px; top: 2px; height: 50px; }
.card .ti { position: absolute; left: 8px; right: 6px; top: 48px; font-weight: 900; font-size: 12.5px; line-height: 1.15; text-align: left; max-height: 29px; overflow: hidden; }
.card .gp { position: absolute; left: 8px; bottom: 6px; font-size: 10.5px; font-weight: 900; color: #fff; background: linear-gradient(#7fdcff,#1b8ff0); padding: 0 8px; border-radius: 99px; border: 2px solid #0b4a96; white-space: nowrap; }
.card .done { position: absolute; right: 4px; bottom: 2px; height: 26px; }
.foot { margin: 12px 0 0; font-size: 12px; font-weight: 800; color: #fff; text-shadow: 0 1px 2px rgba(0,0,0,.5); }

/* GAME */
#game { position: absolute; inset: 0; display: flex; flex-direction: column; z-index: 2; }
#top { display: flex; align-items: center; gap: 10px; padding: 4px 14px 0; height: 62px; flex: none; background: linear-gradient(#ffc04a, #ff8a1f); border-bottom: 6px solid #9a4a00; box-shadow: 0 4px 0 rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.55); }
#top .title { flex: 1; min-width: 0; color: #fff; text-shadow: -2px -2px 0 #9a4a00, 2px -2px 0 #9a4a00, -2px 2px 0 #9a4a00, 2px 2px 0 #9a4a00, 0 3px 0 #9a4a00 !important; font-weight: 900; font-size: 21px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#top .title small { display: inline-block; margin-left: 10px; font-size: 12px; background: linear-gradient(#7fdcff,#1b8ff0); color: #fff; padding: 2px 12px; border-radius: 99px; border: 3px solid #0b4a96; text-shadow: none; vertical-align: middle; }
#stage { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 304px; gap: 6px; padding: 6px 10px 8px; }
#boardWrap { position: relative; min-height: 0; min-width: 0; display: flex; align-items: center; justify-content: center; }
#cv { display: block; touch-action: none; }
#side { display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow-y: auto; padding: 2px 4px 6px 0; }
.panel { border: 4px solid #8a4b14; border-radius: 18px; background: linear-gradient(#fffef2, #ffeeb8); padding: 7px 10px; box-shadow: 0 4px 0 #8a4b14, 0 8px 8px rgba(0,0,0,.2), inset 0 3px 0 rgba(255,255,255,.9); }
.panel h3 { margin: 0 0 5px; font-size: 13px; color: #d4531c; letter-spacing: .5px; }
#hcard { display: flex; align-items: center; gap: 8px; }
#hcard img { height: 58px; margin: -6px 0 -4px; filter: drop-shadow(0 3px 0 rgba(0,0,0,.2)); }
#hcard .t { font-weight: 800; font-size: 13px; } #hcard .t b { font-size: 16px; }
#sents { display: flex; flex-direction: column; gap: 5px; min-height: 40px; }
.sent { background: #fffdf3; border-radius: 12px; padding: 5px 7px; border: 3px solid #ecd9a8; }
.sent.ok { border-color: #34b45f; background: #effcf1; }
.sent .row { display: flex; gap: 4px; flex-wrap: wrap; }
.sent .jp { font-size: 12.5px; font-weight: 800; margin-top: 3px; }
.sent .note { font-size: 11.5px; font-weight: 800; color: #1f9d4b; } .sent:not(.ok) .note { color: #9b7a50; }
.none { font-size: 12.5px; font-weight: 800; opacity: .6; }
#msg { font-weight: 800; font-size: 13.5px; line-height: 1.4; min-height: 70px; display: flex; align-items: center; }
#msg.warn { background: linear-gradient(#ffe9e5, #ffc9c2); border-color: #b3261e; box-shadow: 0 4px 0 #b3261e, 0 8px 8px rgba(0,0,0,.2); color: #b3261e; }
#msg.hint { background: linear-gradient(#fffbd0, #ffee7a); }
.side-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.mini-legend { display: flex; gap: 5px; flex-wrap: wrap; } .mini-legend .chip { min-width: 0; font-size: 11px; padding: 1px 7px; }
.keys { margin-top: 6px; font-size: 11.5px; font-weight: 800; opacity: .75; }
#dpad { display: none; position: absolute; right: 12px; bottom: 12px; width: 156px; height: 156px; z-index: 20; }
#dpad button { position: absolute; width: 54px; height: 54px; padding: 0 !important; border-radius: 50% !important; } #dpad button img.ic { height: 24px; margin: 0; }
@media (min-width: 1200px) { .grid { grid-template-columns: repeat(8, 1fr); } }
@media (pointer: coarse) { #dpad { display: block; } }
@media (max-width: 860px) { #stage { grid-template-columns: 1fr; grid-template-rows: 1fr auto; } #side { flex-direction: row; flex-wrap: wrap; max-height: 34vh; } #side .panel { flex: 1 1 240px; } }

/* win overlay */
#win { position: absolute; inset: 0; background: rgba(60,30,0,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 12px; }
#winbox { position: relative; border: 6px solid #8a4b14; border-radius: 28px; background: linear-gradient(#fffef2, #ffeeb8); padding: 14px 24px 18px; max-width: 470px; width: 100%; text-align: center;
  box-shadow: 0 8px 0 #8a4b14, 0 14px 16px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.9); animation: pop .4s cubic-bezier(.3,1.6,.5,1); }
@keyframes pop { from { transform: scale(.5); opacity: 0; } }
#winbox h2 { margin: 0; font-size: 38px; color: #fff; -webkit-text-stroke: 7px var(--woodD); paint-order: stroke fill; text-shadow: 0 4px 0 var(--woodD); }
#winbox .hero { height: 104px; margin: -2px 0 -6px; animation: cheer .6s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
@keyframes cheer { 50% { transform: translateY(-12px) rotate(3deg); } }
#winbox .stars { display: flex; justify-content: center; gap: 6px; margin: 4px 0 2px; } #winbox .stars img { height: 46px; animation: starin .5s both; filter: drop-shadow(0 3px 0 rgba(0,0,0,.25)); }
#winbox .stars img:nth-child(2) { animation-delay: .15s; } #winbox .stars img:nth-child(3) { animation-delay: .3s; }
@keyframes starin { from { transform: scale(0) rotate(-90deg); } }
#winbox .sent { text-align: left; margin: 5px 0; } #winbox .stat { font-weight: 900; margin: 4px 0 10px; }
#winbox .btns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }

/* tutorial */
#tut { position: absolute; inset: 0; z-index: 70; display: flex; align-items: center; justify-content: center; background: rgba(60,30,0,.35); padding: 8px; }
#tutbox { position: relative; width: min(980px, 100%); height: min(560px, 100%); border: 6px solid #8a4b14; border-radius: 28px; background: linear-gradient(#fffef2, #ffeeb8); box-shadow: 0 8px 0 #8a4b14, 0 14px 16px rgba(0,0,0,.3), inset 0 4px 0 rgba(255,255,255,.9); display: flex; flex-direction: column; padding: 8px 20px 10px; animation: pop .35s cubic-bezier(.3,1.6,.5,1); }
#tutHead { display: flex; align-items: center; justify-content: center; gap: 10px; height: 46px; flex: none; }
#tutHead h2 { margin: 0; font-size: 30px; color: #fff; -webkit-text-stroke: 7px #9a4a00; paint-order: stroke fill; text-shadow: 0 4px 0 #9a4a00; text-align: center; }
#tutBody { flex: 1; min-height: 0; display: flex; align-items: center; gap: 18px; }
#tutGuide { flex: none; width: 190px; text-align: center; } #tutGuide img { height: 170px; animation: cheer 1.1s ease-in-out infinite; filter: drop-shadow(0 4px 0 rgba(0,0,0,.2)); }
#tutMain { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px; align-items: stretch; justify-content: center; height: 100%; }
.say { background: #fff; border: 4px solid #8a4b14; border-radius: 18px; padding: 8px 14px; font-weight: 900; font-size: 21px; line-height: 1.5; position: relative; box-shadow: 0 4px 0 rgba(60,30,0,.25); }
.say::before { content: ""; position: absolute; left: -18px; top: 30px; border: 10px solid transparent; border-right: 14px solid #8a4b14; }
.say small { display: block; font-size: 15px; opacity: .85; margin-top: 2px; }
.say em { font-style: normal; color: #d4531c; } .say b.g { color: #1f9d4b; } .say b.r { color: #c4271e; }
.vis { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; background: rgba(255,255,255,.55); border: 3px dashed #d9b97a; border-radius: 18px; padding: 8px; }
.vis img.s { height: 84px; } .vis img.hh { height: 104px; }
.vcol { display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 900; font-size: 15px; text-align: center; }
.vcol .lab { padding: 1px 10px; border-radius: 99px; color: #fff; border: 2px solid var(--woodD); text-shadow: 0 1px 0 rgba(70,35,5,.8); font-size: 14px; }
.vcol .big { font-size: 28px; color: #d4531c; -webkit-text-stroke: 5px #fff; paint-order: stroke fill; line-height: 1; }
.tb { position: relative; display: inline-block; width: 78px; height: 74px; } .tb img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 3px 0 rgba(60,30,0,.3)); }
.tb b { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 17px; -webkit-text-stroke: 4px #5a2f0d; paint-order: stroke fill; }
.arrow { font-size: 34px; font-weight: 900; color: #d4531c; } .ok { color: #1f9d4b; font-size: 34px; font-weight: 900; } .ng { color: #d22; font-size: 34px; font-weight: 900; }
.row { display: flex; align-items: center; gap: 6px; }
.vis .eq { font-size: 20px; font-weight: 900; }
#tutNav { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 10px; height: 52px; padding-top: 4px; }
#tutDots { display: flex; gap: 6px; } #tutDots i { width: 11px; height: 11px; border-radius: 50%; background: #d9b97a; border: 2px solid var(--woodD); } #tutDots i.on { background: #ff7a3c; transform: scale(1.25); }
.sbtn.ghost { filter: grayscale(.4) drop-shadow(0 3px 0 rgba(60,30,0,.3)); opacity: .85; }
@media (max-height: 520px) { .say { font-size: 18px; } #tutGuide img { height: 130px; } #tutGuide { width: 150px; } }
.toprow { display: flex; align-items: center; justify-content: center; gap: 16px; margin: 0 0 6px; } .toprow .legend { margin: 0; } .toprow .sbtn { margin-bottom: 5px; }
body.nojp .jpx { display: none; }
</style>
</head>
<body>
<canvas id="bg"></canvas>

<div id="menu">
  <div id="logo"></div>
  <p class="sub">ことばブロックを おして、ぶんを つくろう!</p>

      </div>
    </div>
  </div>
  <div id="dpad"><button style="left:52px;top:0" data-d="U" id="dU"></button><button style="left:0;top:52px" data-d="L" id="dL"></button>
    <button style="left:104px;top:52px" data-d="R" id="dR"></button><button style="left:52px;top:104px" data-d="D" id="dD"></button></div>
</div>
<div id="tut" class="hidden"><div id="tutbox"><div id="tutHead"><h2 id="tutT"></h2></div><div id="tutBody"><div id="tutGuide"><img id="tutImg" alt=""></div><div id="tutMain"><div class="say" id="tutSay"></div><div class="vis" id="tutVis"></div></div></div><div id="tutNav"><button class="sbtn sm red" id="tSkip">スキップ</button><div id="tutDots"></div><div style="display:flex;gap:8px"><button class="sbtn sm blue" id="tBack">◀ もどる</button><button class="sbtn green" id="tNext">つぎへ ▶</button></div></div></div></div>
<div id="win" class="hidden"><div id="winbox"></div></div>

  // ---------- drawing ----------
  const cv = $('#cv'), ctx = cv.getContext('2d');
  function drawImg(k, cx, by, w, alpha) { // centered on cx, bottom at by, width w

  function fitText(txt, maxW, size, weight) { ctx.font = weight + ' ' + size + 'px ' + FONT; let w = ctx.measureText(txt).width; if (w > maxW) { size = size * maxW / w; ctx.font = weight + ' ' + size + 'px ' + FONT; } return size; }

  function terrainAt(x, y) { return L.tiles[y][x]; }
  function passInfo(ch) {

    if (ch === 'R') return { pass: R.river, can: !R.river && (fly || R.abil.has('SWIM')) };

  function drawBoard(time, dt) {
    const w = T * L.w + 2 * FW, h = T * L.h + 2 * FW;
    ctx.clearRect(0, 0, w, h);
    // frame backing + shadow
    ctx.save(); ctx.shadowColor = 'rgba(50,25,0,.45)'; ctx.shadowBlur = 16; ctx.shadowOffsetY = 8; ctx.fillStyle = '#3d8f3f'; ctx.fillRect(FW - 2, FW - 2, T * L.w + 4, T * L.h + 4); ctx.restore();

    ctx.save(); ctx.translate(FW, FW);

    // floor

      const ch = terrainAt(x, y);
      if (ch === '#') continue;

        const pi = passInfo('R');
        drawTile('water', x * T, y * T, S);
        ctx.save(); ctx.beginPath(); ctx.rect(x * T, y * T, T, T); ctx.clip();
        if (pi.pass) {
          ctx.fillStyle = 'rgba(228,247,255,.86)'; ctx.fillRect(x * T, y * T, T, T);
          ctx.strokeStyle = 'rgba(120,180,215,.7)'; ctx.lineWidth = 2; ctx.beginPath();

        }
        ctx.restore();

      drawTile(g, x * T, y * T, S);
    }
    // bushes
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) if (terrainAt(x, y) === '#') drawTile('bush' + ((hash(x, y, 5) * 4) | 0), x * T - 1, y * T - 1, S + 2);
    // ability hint rings
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
      const ch = terrainAt(x, y); const pi = passInfo(ch);
      if (pi.can) { const a = .35 + .25 * Math.sin(time * 4); ctx.strokeStyle = 'rgba(255,255,140,' + a + ')'; ctx.lineWidth = 3; ctx.setLineDash([6, 5]); ctx.lineDashOffset = -time * 14; ctx.strokeRect(x * T + 4, y * T + 4, T - 8, T - 8); ctx.setLineDash([]); }
    }
    // static objects sorted by row, then dynamic
    const drawList = [];
    for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
      const ch = terrainAt(x, y); const pi = passInfo(ch);

      else if (ch === 'W') drawList.push({ y: y + .5, f: () => drawTile(pi.pass ? 'lowwall' : 'wall', x * T, y * T, S) });
      else if (ch === 'D') drawList.push({ y: y + .5, f: () => drawTile(pi.pass ? 'door_open' : 'door_closed', x * T, y * T, S) });
      else if (ch === 'S' || WP.ITEM_CHARS[ch]) {

    const stBlocks = L.words.map((w, k) => ({ k, w }));

    drawList.sort((a, b) => a.y - b.y).forEach(o => o.f());
    // particles
    for (let i = parts.length - 1; i >= 0; i--) {
      const p = parts[i]; p.life -= dt; if (p.life <= 0) { parts.splice(i, 1); continue; }
      p.vy += p.g * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt;
      const a = Math.min(1, p.life / p.max * 1.6), px = p.x * T, py = p.y * T, s = p.size * T;
      ctx.globalAlpha = a;
      if (p.kind === 'puff') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(px, py, s * (1.5 - a * .5), 0, 7); ctx.fill(); }
      else if (p.kind === 'drop') { ctx.fillStyle = p.color; ctx.beginPath(); ctx.arc(px, py, s, 0, 7); ctx.fill(); }
      else if (p.kind === 'spark' || p.kind === 'star') {
        ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.strokeStyle = 'rgba(120,70,0,.5)'; ctx.lineWidth = 1; ctx.beginPath();
        const r1 = s * (p.kind === 'star' ? 1.4 : 1.2), r2 = r1 * .38; for (let k = 0; k < 8; k++) { const r = k % 2 ? r2 : r1, an = k * Math.PI / 4; ctx.lineTo(Math.cos(an) * r, Math.sin(an) * r); } ctx.closePath(); ctx.fill(); ctx.stroke(); ctx.restore();
      } else if (p.kind === 'conf') { ctx.save(); ctx.translate(px, py); ctx.rotate(p.rot); ctx.fillStyle = p.color; ctx.fillRect(-s * .6, -s * .3, s * 1.2, s * .6); ctx.restore(); }

    }
    ctx.restore();
    // wooden frame (9-slice)
    const rr = (x, y, ww, hh, r) => { ctx.moveTo(x + r, y); ctx.arcTo(x + ww, y, x + ww, y + hh, r); ctx.arcTo(x + ww, y + hh, x, y + hh, r); ctx.arcTo(x, y + hh, x, y, r); ctx.arcTo(x, y, x + ww, y, r); ctx.closePath(); };
    ctx.save(); ctx.beginPath(); rr(1, 1, w - 2, h - 2, 20); rr(FW - 3, FW - 3, w - 2 * FW + 6, h - 2 * FW + 6, 7);
    const fg = ctx.createLinearGradient(0, 0, 0, h); fg.addColorStop(0, '#ffc15a'); fg.addColorStop(.5, '#f08a24'); fg.addColorStop(1, '#c9610f');
    ctx.fillStyle = fg; ctx.fill('evenodd');
    ctx.lineJoin = 'round'; ctx.strokeStyle = '#7a3a08'; ctx.lineWidth = 3; ctx.beginPath(); rr(1.5, 1.5, w - 3, h - 3, 20); ctx.stroke(); ctx.beginPath(); rr(FW - 3, FW - 3, w - 2 * FW + 6, h - 2 * FW + 6, 7); ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.lineWidth = 3; ctx.beginPath(); rr(6, 6, w - 12, h - 12, 15); ctx.stroke();
    ctx.fillStyle = '#ffe7a0'; [[9, 9], [w - 9, 9], [9, h - 9], [w - 9, h - 9]].forEach(([bx, by]) => { ctx.beginPath(); ctx.arc(bx, by, 3.2, 0, 7); ctx.fill(); ctx.strokeStyle = '#7a3a08'; ctx.lineWidth = 1.5; ctx.stroke(); });
    ctx.restore();
  }

  function drawBlock(k, w, time) {
    const b = E.blocks[k], d = WP.WORDS[w], s = E.status[k];
    const col = BLK[d.t], x = b.x * T, y = b.y * T; let sh = 0;
    if (s === 'bad') sh = Math.sin(time * 50) * 2.5;
    const sq = b.sq; const sc = 1 + Math.sin(sq * 12.5) * .12;
    const cx = x + T / 2 + sh, cy = y + T / 2;
    ctx.save();
    shadow(cx, y + T * .92, T * .4, .25);
    ctx.translate(cx, cy); ctx.scale(sc, 2 - sc);
    if (s === 'ok') { ctx.shadowColor = '#43ff7a'; ctx.shadowBlur = 16 + Math.sin(time * 6) * 4; }
    else if (s === 'soft') { ctx.shadowColor = '#6cc6ff'; ctx.shadowBlur = 11; }
    else if (s === 'bad') { ctx.shadowColor = '#ff3b3b'; ctx.shadowBlur = 14; }
    const im = IMG['blk_' + col]; const bs = T - 4;
    if (im && im.naturalWidth) { const bh = bs * im.naturalHeight / im.naturalWidth; ctx.drawImage(im, -bs / 2, -bh / 2, bs, bh); if (s) ctx.drawImage(im, -bs / 2, -bh / 2, bs, bh); }
    ctx.shadowBlur = 0; ctx.shadowColor = 'transparent';
    // word
    const jp = !document.body.classList.contains('nojp');
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    const sz = fitText(w, bs * .78, T * (w.length <= 3 ? .36 : .3), 900); const ty = jp ? -T * .08 : 0;
    ctx.lineWidth = Math.max(3, sz * .24); ctx.strokeStyle = '#5a2f0d'; ctx.strokeText(w, 0, ty); ctx.fillStyle = '#fff'; ctx.fillText(w, 0, ty);
    if (jp) { const jsz = fitText(d.jp, bs * .78, T * .17, 900); ctx.lineWidth = Math.max(2, jsz * .22); ctx.strokeStyle = '#5a2f0d'; ctx.strokeText(d.jp, 0, T * .24); ctx.fillStyle = '#fff6c9'; ctx.fillText(d.jp, 0, T * .24); }
    ctx.restore();
  }

  function heroPose(time) {
    const hr = E.hero, key = heroKey(L); let pose = 'idle', yoff = 0, swim = false;
    const tx = Math.round(hr.x), ty = Math.round(hr.y); const ch = (L.tiles[ty] && L.tiles[ty][tx]) || '.';
    const pi = passInfo(ch);
    if (hr.cheer) pose = 'cheer';
    else if (hr.bump > 0) pose = 'bump';
    else if (ch === 'R' && !pi.pass) { pose = E.fly ? 'fly' : 'swim'; swim = !E.fly; }
    else if (ch === 'M' && !pi.pass) pose = E.fly ? 'fly' : 'climb';
    else if (ch === 'W' && !pi.pass) pose = E.fly ? 'fly' : 'hop';
    else if (hr.hop > 0) pose = 'hop';
    else pose = (Math.floor(time * 1.8) % 2) ? 'idle2' : 'idle';

  }
  function drawHero(time) {
    const hr = E.hero, { pose, key, swim, ch } = heroPose(time);
    let cx = (hr.x + .5) * T, by = (hr.y + .94) * T; let hop = 0, bob = 0;
    if (hr.hop > 0) hop = Math.sin((1 - hr.hop / .26) * Math.PI) * T * (hr.hopBig ? .42 : .22);
    if (hr.cheer) hop = Math.abs(Math.sin(time * 7)) * T * .3;
    if (pose === 'fly') bob = Math.sin(time * 5) * T * .06 + T * .12; if (swim) bob = Math.sin(time * 4) * T * .04;
    if (hr.bump > 0) cx += hr.bdx * Math.sin(hr.bump * 30) * T * .06;
    shadow(cx, (hr.y + .92) * T, T * (.3 - hop / T * .2), swim ? 0 : .28);
    ctx.save(); ctx.translate(cx, by - hop - bob);
    const flip = hr.face < 0 ? -1 : 1; ctx.scale(flip, 1);
    const k = key + '_' + pose; const wTarget = T * (pose === 'swim' ? 1.15 : pose === 'fly' ? 1.28 : 1.02);
    const im = IMG[k]; if (im && im.naturalWidth) { const sc = Math.min(wTarget / im.naturalWidth, (T * 1.18) / im.naturalHeight * (pose === 'fly' || pose === 'cheer' ? 1.15 : 1)); const w2 = im.naturalWidth * sc, h2 = im.naturalHeight * sc; ctx.drawImage(im, -w2 / 2, -h2, w2, h2); }
    ctx.restore();
  }

  // ---------- background ----------
  const bgc = $('#bg'), bctx = bgc.getContext('2d'); let bgW = 0, bgH = 0; const clouds = Array.from({ length: 6 }, (_, i) => ({ x: Math.random(), y: .05 + Math.random() * .3, s: .6 + Math.random() * .8, v: .004 + Math.random() * .006 }));
  function drawBg(time) {
    const dpr = 1; const W = innerWidth, H = innerHeight;
    if (W !== bgW || H !== bgH) { bgW = bgc.width = W; bgH = bgc.height = H; }
    const g = bctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, '#5cc4ff'); g.addColorStop(.6, '#bfeaff'); g.addColorStop(1, '#e8fbff'); bctx.fillStyle = g; bctx.fillRect(0, 0, W, H);
    // sun
    const sg = bctx.createRadialGradient(W * .85, H * .16, 10, W * .85, H * .16, 150); sg.addColorStop(0, 'rgba(255,248,190,1)'); sg.addColorStop(.25, 'rgba(255,240,150,.8)'); sg.addColorStop(1, 'rgba(255,240,150,0)'); bctx.fillStyle = sg; bctx.fillRect(0, 0, W, H);

    hill(.68, 26, .006, .03, '#8fd97a'); hill(.78, 22, .008, .05, '#6ccb5f'); hill(.88, 16, .011, .08, '#4fb84f');
  }

  // ---------- main loop ----------
  let last = performance.now(), frame = 0;
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now; const time = now / 1000; frame++;

      const k = 1 - Math.exp(-dt * 20);

      const h = E.hero; h.x += (st.hx - h.x) * k; h.y += (st.hy - h.y) * k; if (h.hop > 0) h.hop = Math.max(0, h.hop - dt); if (h.bump > 0) h.bump = Math.max(0, h.bump - dt);

    }
    requestAnimationFrame(loop);
  }

  // ---------- sfx ----------

      const b = SND[kind]; if (!b) return; const g = ac.createGain(); g.gain.value = VOL[kind] || .5;

  document.addEventListener('click', e => { if (e.target.closest && e.target.closest('.sbtn, .card')) sfx('ui'); });

  document.addEventListener('keydown', e => {

    else if (k === 'h') { hintOn = !hintOn; refresh(true); }

  document.querySelectorAll('#dpad button').forEach(b => b.addEventListener('pointerdown', e => { e.preventDefault(); go(b.dataset.d); }));
  let tx = 0, ty = 0;
  $('#boardWrap').addEventListener('touchstart', e => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; }, { passive: true });
  $('#boardWrap').addEventListener('touchend', e => { const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty; if (Math.max(Math.abs(dx), Math.abs(dy)) < 24) return; go(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'R' : 'L') : (dy > 0 ? 'D' : 'U')); }, { passive: true });
  $('#bMenu').onclick = showMenu; $('#bUndo').onclick = undo; $('#bReset').onclick = restart;
  $('#bHint').onclick = () => { hintOn = !hintOn; refresh(true); };
  $('#bJp').onclick = () => { document.body.classList.toggle('nojp'); try { localStorage.setItem('wordpush_nojp', document.body.classList.contains('nojp') ? '1' : '0'); } catch (e) {} };
  $('#bSnd').onclick = () => { soundOn = !soundOn; $('#bSnd').innerHTML = '<img class="ic" src="' + src(soundOn ? 'i_on' : 'i_off') + '">' + (soundOn ? 'おと ON' : 'おと OFF'); sfx('step'); };
  window.addEventListener('resize', layout);
  if (window.ResizeObserver) new ResizeObserver(layout).observe($('#boardWrap'));


  // ---------- tutorial ----------
  const tb = w => { const c = BLK[WP.WORDS[w].t]; return '<span class="tb"><img src="' + src('blk_' + c) + '"><b>' + w + '</b></span>'; };

  const SL = [

    { t: 'あるきかた', g: 'idle', say: '<em>↑ ↓ ← →</em> の キーで あるくよ。<small>W A S D でも いいよ。スマホは ゆびで スワイプ!</small>',
      vis: () => '<div style="position:relative;width:200px;height:130px">' + [['arr_u', 74, 0], ['arr_l', 14, 62], ['arr_d', 74, 62], ['arr_r', 134, 62]].map(a => '<img src="' + src(a[0]) + '" style="position:absolute;width:56px;left:' + a[1] + 'px;top:' + a[2] + 'px">').join('') + '</div>' },
    { t: 'ブロックを おそう', g: 'hop', say: 'ブロックに ぶつかると、<em>おせる</em>よ!<small>ブロックは ことばが かいて あるよ。</small>',
      vis: () => im('I_idle', 'hh') + tb('CAT') + '<span class="arrow">▶</span>' + '<span style="width:24px"></span>' + tb('CAT') },

    { t: 'よむ むき', g: 'idle', say: 'ぶんは <em>ひだり → みぎ</em>、<em>うえ → した</em> に よむよ。<small>ブロックは たてにも ならべられるよ。</small>',
      vis: () => '<div class="row">' + tb('DOG') + tb('CAN') + tb('SWIM') + '</div><span style="width:30px"></span><div class="vcol">' + tb('DOG') + tb('CAN') + tb('SWIM') + '</div>' },
    { t: 'ぶんが できると…', g: 'cheer', say: 'ぶんが できると、<b class="g">みどりに ひかる</b>よ。<small>ふしぎな ちからが でるよ! たとえば DOOR IS OPEN → ドアが あく!</small>',
      vis: () => im('door_closed', 'hh') + '<span class="arrow">▶</span>' + '<div class="row">' + tb('DOOR') + tb('IS') + tb('OPEN') + '</div><span class="arrow">▶</span>' + im('door_open', 'hh') },
    { t: 'やさしい えいご', g: 'idle', say: 'この ゲームの えいごは、<em>かんたんに して ある</em>よ。<small>ほんとうの えいごは「The door is open.」みたいに a や the が つくよ。ぜんぶ おおきい もじで かいて あるよ。</small>',
      vis: () => '<div class="vcol"><div class="row">' + tb('DOOR') + tb('IS') + tb('OPEN') + '</div>' + lab('ゲームの えいご', '#e9b81c') + '</div><span class="arrow">≒</span><div class="vcol"><span style="font-size:30px;font-weight:900">The door is open.</span>' + lab('ほんとうの えいご', '#4cb8ff') + '</div>' },
    { t: 'こまった ときは', g: 'bump', say: 'まちがえても だいじょうぶ! なんどでも やりなおせるよ。',
      vis: () => '<div class="vcol"><button class="sbtn green" style="pointer-events:none">もどす</button><b>キー: Z</b></div><div class="vcol"><button class="sbtn red" style="pointer-events:none">やりなおし</button><b>キー: R</b></div><div class="vcol"><button class="sbtn" style="pointer-events:none">ヒント</button><b>キー: H</b></div>' },
    { t: 'れんしゅう しよう!', g: 'cheer', say: 'まず 2つ れんしゅう しよう!<small>そのあと ほんばん。がんばろう!</small>', vis: () => im('I_cheer', 'hh') + im('star', 'hh') + im('DOG_cheer', 'hh') }
  ];
  let ti = 0, tutAfter = null;
  const GKEY = { I: 'I', BOY: 'BOY', GIRL: 'GIRL' };
  function showTut(n) {
    ti = Math.max(0, Math.min(SL.length - 1, n)); const sl = SL[ti];
    $('#tutT').textContent = sl.t; $('#tutImg').src = src('I_' + sl.g);

  }, true);

  loaded.then(() => {

    const m = location.hash.match(/level=(\d+)/);
    if (m && PARSED[+m[1] - 1]) startLevel(+m[1] - 1); else { showMenu(); let seen = '1'; try { seen = localStorage.getItem('wordpush_tut'); } catch (e) {} if (!seen) openTut(); }

  });

})();
